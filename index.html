<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>水没迷宮</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-bleed isometric stage; minimap + progress top-left, gauges top-right, banners top-center, overlay card center.
   Single deliberate look: a night-time underground ruin flooding with teal water. */
:root{
  --night:#0b1620;
  --stone:#e2cc9c;
  --water:#3cc6e6;
  --ember:#ff7a3d;
  --amber:#ffc24d;
  --ink:#eef6f8;
  --panel:rgba(11,22,32,.8);
  --line:rgba(226,204,156,.28);
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important;}
html,body{height:100%;}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;user-select:none;-webkit-user-select:none;}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.hud{position:fixed;display:flex;flex-direction:column;pointer-events:none;z-index:2;}
.hud.tl{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));gap:8px;}
.hud.tr{top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));align-items:flex-end;gap:7px;}
#mini{display:block;border-radius:10px;background:var(--panel);border:1px solid var(--line);}
.info{display:flex;flex-direction:column;gap:1px;}
.zone{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--stone);}
.score{font-family:var(--display);font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.4);}
.gauge{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.glabel{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--amber);font-variant-numeric:tabular-nums;}
.gbar{width:200px;height:16px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid var(--line);position:relative;}
.gbar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--amber);}
.gbar.flow i{background:linear-gradient(90deg,#1f8fb8,var(--water));}
.gbar.hot{animation:pulse .35s ease-in-out infinite alternate;}
@keyframes pulse{to{box-shadow:0 0 14px var(--amber);}}
@media (prefers-reduced-motion:reduce){.gbar.hot{animation:none;}}
.o2{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em;}
.o2bar{width:130px;height:9px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;border:1px solid var(--line);}
.o2bar i{display:block;height:100%;width:100%;background:#9fe8ff;}
.o2bar.low i{background:var(--ember);}
.o2.st .o2bar i{background:#ffd34d;transition:width .08s;}.o2.st .o2bar.low i{background:#ff9a4a;}
#dodgebtn{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 168px);bottom:calc(30px + env(safe-area-inset-bottom,0px));width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:#ffd34d;font-weight:800;font-size:14px;z-index:3;display:none;touch-action:none;}
#dodgebtn:active{background:rgba(255,211,77,.3);}
#guardbtn{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 168px);bottom:calc(112px + env(safe-area-inset-bottom,0px));width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:#9fe8ff;font-weight:800;font-size:14px;z-index:3;display:none;touch-action:none;}
#guardbtn:active{background:rgba(140,220,255,.3);}
@media (pointer:coarse){#guardbtn{display:block;}}
body.cine #guardbtn{display:none!important;}
@media (pointer:coarse){#dodgebtn{display:block;}}
body.cine #dodgebtn{display:none!important;}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:220px;}
.chip{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-variant-numeric:tabular-nums;}
.chip.goal{color:var(--amber);border-color:rgba(255,194,77,.55);}
.chip.ice{color:#bff3ff;border-color:rgba(191,243,255,.5);}
.chip.cat{color:#ffd0e0;border-color:rgba(255,160,190,.5);}
.chip.boot{color:#ffd0b5;border-color:rgba(255,160,110,.5);}
#radio{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(640px,calc(100vw - 32px));z-index:6;display:flex;gap:12px;align-items:stretch;
  background:rgba(10,22,30,.92);border:2px solid #3cc6e6;border-radius:14px;padding:12px 14px;box-shadow:0 0 0 4px rgba(60,198,230,.15),0 10px 30px rgba(0,0,0,.5);cursor:pointer;user-select:none;}
#radio[hidden]{display:none;}
#radio .face canvas{width:100%;height:100%;display:block;}
#radio .face{flex:0 0 76px;height:76px;overflow:hidden;border-radius:10px;background:repeating-linear-gradient(0deg,rgba(60,198,230,.10) 0 2px,rgba(0,0,0,0) 2px 4px),#0e2a36;border:1px solid rgba(60,198,230,.5);}
#radio .body{flex:1;min-width:0;display:flex;flex-direction:column;}
#radio .who{font-size:12px;font-weight:800;color:#3cc6e6;letter-spacing:.06em;display:flex;align-items:center;gap:6px;}
#radio .who i{width:8px;height:8px;border-radius:50%;background:#ff5a4a;box-shadow:0 0 8px #ff5a4a;animation:rblink .8s infinite;}
@keyframes rblink{50%{opacity:.25}}
#radio .msg{margin-top:4px;font-size:15px;line-height:1.55;color:#eaf6fa;font-weight:700;min-height:3.1em;}
#radio .nx{align-self:flex-end;font-size:11px;color:#9fc3cf;margin-top:2px;}
#radio.static .msg{animation:rshake .12s 3;}
@keyframes rshake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
#banner{position:fixed;left:50%;top:24%;transform:translateX(-50%);font-family:var(--display);text-align:center;z-index:2;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.55);white-space:nowrap;}
#banner small{display:block;font-size:14px;letter-spacing:.2em;color:var(--stone);}
#banner span{display:block;font-size:34px;color:var(--ink);}
.pad{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:156px;height:156px;z-index:3;display:none;}
@media (pointer:coarse){.pad{display:block;}}
.pad button{position:absolute;width:62px;height:62px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--stone);font-size:24px;display:grid;place-items:center;touch-action:none;}
.pad button:active{background:rgba(60,198,230,.35);}
.pad .ur{right:0;top:0}.pad .dr{right:0;bottom:0}.pad .dl{left:0;bottom:0}.pad .ul{left:0;top:0}
#overlay{position:fixed;inset:0;display:grid;place-items:center;z-index:5;background:rgba(6,12,18,.55);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;overflow-y:auto;}
.card{max-width:460px;width:100%;background:rgba(14,28,40,.95);border:1px solid var(--line);border-radius:18px;padding:24px 22px 20px;display:flex;flex-direction:column;gap:13px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.card h1{margin:0;font-family:var(--display);font-weight:400;font-size:44px;line-height:1.05;color:var(--stone);}
.card h1 em{font-style:normal;color:var(--water);}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px;color:var(--ink);}
.card p{margin:0;line-height:1.7;font-size:14px;color:#cfe0e6;}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;align-items:center;}
.keys kbd{font-family:var(--body);font-weight:800;font-size:12px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--stone);white-space:nowrap;}
.legend{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:13px;align-items:center;}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums;}
.stats b{font-family:var(--display);font-weight:400;color:var(--stone);text-align:right;}
.btn{font-family:var(--display);font-size:18px;letter-spacing:.06em;padding:12px 18px;border-radius:12px;border:0;background:var(--water);color:#06202a;cursor:pointer;}
.btn:focus-visible{outline:3px solid var(--stone);outline-offset:3px;}
.hint{font-size:12px;color:#9fb6bf;line-height:1.6;}
#bigtimer{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);text-align:center;z-index:2;pointer-events:none;font-family:var(--display);text-shadow:0 4px 0 rgba(0,0,0,.55);}
#bigtimer small{display:block;font-size:15px;letter-spacing:.15em;color:var(--amber);}
#bigtimer b{display:block;font-weight:400;font-size:88px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;}
#bigtimer b i{font-style:normal;font-size:32px;margin-left:4px;}
#bigtimer.red b{color:#ff6b5a;}
#bigtimer.pop b{animation:pop .25s ease-out;}
@keyframes pop{from{transform:scale(1.35)}to{transform:scale(1)}}
#bosshp{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;}
#bosshp span{font-family:var(--display);font-size:15px;color:#ffb3a6;letter-spacing:.1em;text-shadow:0 2px 0 rgba(0,0,0,.5);}
.bhp{width:min(240px,40vw);height:12px;border-radius:6px;background:rgba(0,0,0,.45);border:1px solid rgba(255,140,120,.5);overflow:hidden;}
.bhp i{display:block;height:100%;background:linear-gradient(90deg,#ff5a4a,#ff9a6a);transition:width .3s;}
@media (max-width:640px){#bosshp{top:calc(215px + env(safe-area-inset-top,0px));}.bhp{width:200px}}
.hearts{display:flex;gap:3px;font-size:22px;line-height:1;}
.hearts i{font-style:normal;color:#ff5a6e;text-shadow:0 2px 0 rgba(0,0,0,.45);}
.hearts i.empty{color:rgba(255,255,255,.22);}
.hearts.hit{animation:blink .18s steps(2) infinite;}
@keyframes blink{50%{opacity:.2}}
.wallet{font-size:14px;font-weight:800;color:#ffd34d;font-variant-numeric:tabular-nums;}
#shop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));z-index:4;background:rgba(18,14,30,.94);border:1px solid rgba(214,160,255,.45);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 40px rgba(0,0,0,.5);}
@media (pointer:coarse){#shop{bottom:calc(186px + env(safe-area-inset-bottom,0px));}}
.shophead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.shophead b{font-family:var(--display);font-weight:400;font-size:18px;color:#e8c6ff;}
.shophead span{font-size:12px;color:#ffb3a6;font-weight:800;}
.shophead .wallet{margin-left:auto;font-size:16px;}
#shoplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;}
.item{display:flex;flex-direction:column;gap:2px;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid rgba(214,160,255,.3);background:rgba(255,255,255,.05);color:var(--ink);font-family:var(--body);cursor:pointer;min-width:0;}
.item:hover:not(:disabled){background:rgba(214,160,255,.16);}
.item:disabled{opacity:.45;cursor:default;}
.item:focus-visible{outline:2px solid #e8c6ff;}
.item .nm{font-weight:800;font-size:13px;}
.item .ds{font-size:11px;color:#b9c6cc;}
.item .pr{font-size:12px;font-weight:800;color:#ffd34d;font-variant-numeric:tabular-nums;}
body.cine .hud,body.cine #banner,body.cine .pad,body.cine #bigtimer,body.cine #bosshp,body.cine #shop{display:none!important;}
#skip{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:.06em;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(11,22,32,.7);color:var(--stone);cursor:pointer;}
#skip:focus-visible{outline:2px solid var(--water);outline-offset:2px;}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:7;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 18px 9px;border-radius:14px;background:rgba(18,14,30,.92);border:1px solid rgba(214,160,255,.5);pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:toastin .3s ease-out;max-width:calc(100% - 32px);}
#toast b{font-size:11px;letter-spacing:.14em;color:#d6a8ff;}
#toast span{font-family:var(--display);font-size:16px;color:var(--ink);text-align:center;}
#toast.tro{border-color:rgba(255,211,77,.6);}#toast.tro b{color:#ffd34d;}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){#toast{animation:none;}}
.arch-list{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow-y:auto;padding-right:4px;}
.arch-h{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--stone);margin-top:6px;}
.arch-i{display:flex;align-items:baseline;gap:8px;text-align:left;padding:7px 10px;border-radius:9px;border:1px solid rgba(214,160,255,.28);background:rgba(255,255,255,.05);color:var(--ink);font-family:var(--body);font-weight:800;font-size:13px;cursor:pointer;}
button.arch-i:hover{background:rgba(214,160,255,.14);}
.arch-i:focus-visible{outline:2px solid #e8c6ff;}
.arch-i .k{flex:none;font-size:10px;padding:1px 6px;border-radius:999px;background:rgba(214,160,255,.2);color:#e8c6ff;}
.arch-i.sec .k{background:rgba(255,211,77,.22);color:#ffd34d;}
.arch-i.lock{color:#6f8790;cursor:default;border-style:dashed;}
.arch-i.lock small{font-weight:500;font-size:11px;color:#9fb6bf;}
.arch-text{font-size:15px!important;line-height:1.9!important;color:var(--ink)!important;padding:12px 14px;border-radius:12px;background:rgba(244,239,228,.06);border-left:3px solid #d6a8ff;}
.tro-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;max-height:52vh;overflow-y:auto;}
.tro-i{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.14);min-width:0;}
.tro-i div{display:flex;flex-direction:column;min-width:0;}
.tro-i b{font-size:13px;color:#6f8790;}
.tro-i small{font-size:11px;color:#9fb6bf;line-height:1.4;}
.tro-i.got{border-style:solid;border-color:rgba(255,211,77,.45);background:rgba(255,211,77,.08);}
.tro-i.got b{color:#ffd34d;}
.cup{flex:none;width:22px;height:22px;border-radius:4px 4px 10px 10px;background:#3a4650;position:relative;}
.cup::after{content:"";position:absolute;left:7px;bottom:-5px;width:8px;height:5px;background:inherit;border-radius:2px;}
.tro-i.got .cup{background:linear-gradient(#ffe98a,#d4a63a);}
.bt-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.bt-list .btn{font-size:15px;padding:10px 8px;}
.ss-row{gap:14px;}
.bt-zone{display:flex;gap:8px;align-items:center;}
.bt-zone select{font-family:var(--body);font-weight:800;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line);}
#mute{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--stone);font-size:16px;font-weight:800;cursor:pointer;}
#mute.off{color:#6f8790;}
#mute:focus-visible{outline:2px solid var(--water);}
#cont{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:rgba(4,8,14,.55);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.cont-box{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
.cont-title{font-family:var(--display);font-size:clamp(40px,9vw,76px);color:var(--ink);letter-spacing:.06em;text-shadow:0 5px 0 rgba(0,0,0,.6);}
.cont-sub{font-family:var(--display);font-size:18px;color:var(--stone);letter-spacing:.2em;}
.cont-num{font-family:var(--display);font-size:clamp(90px,22vw,170px);line-height:1;color:var(--amber);text-shadow:0 6px 0 rgba(0,0,0,.6);font-variant-numeric:tabular-nums;}
.cont-num.low{color:#ff6b5a;}
.cont-num.pop{animation:pop .3s ease-out;}
.cont-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
#overlay.low{place-items:end center;background:linear-gradient(rgba(6,12,18,0) 35%,rgba(6,12,18,.55));}
.ranks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums;}
.ranks li{display:grid;grid-template-columns:2em 1fr auto 5.5em;gap:8px;align-items:baseline;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.04);font-size:13px;}
.ranks li.me{background:rgba(60,198,230,.22);outline:1px solid var(--water);}
.ranks .rk{font-family:var(--display);color:var(--stone);}
.ranks .nm{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ranks .fl{font-size:11px;color:#9fb6bf;}
.ranks .sc{font-family:var(--display);text-align:right;}
.rankbox{display:flex;flex-direction:column;gap:6px;}
.nameinput{flex:2;min-width:0;font-family:var(--body);font-weight:800;font-size:18px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);}
.nameinput:focus-visible{outline:2px solid var(--water);}
.charrow{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;border:1px dashed var(--line);}
.charrow canvas{flex:none;border-radius:8px;background:rgba(255,255,255,.05);}
.charrow div{display:flex;flex-direction:column;gap:6px;min-width:0;}
.sbtn{font-family:var(--body);font-weight:800;font-size:13px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--stone);cursor:pointer;text-align:center;}
.sbtn:focus-visible{outline:2px solid var(--water);outline-offset:2px;}
@media (max-width:480px){.card h1{font-size:36px}.gbar{width:140px}.o2bar{width:96px}.score{font-size:22px}#banner span{font-size:26px}}
</style>

<script>
(()=>{
const cvs=document.getElementById('game');let ctx=cvs.getContext('2d');
const mini=document.getElementById('mini'),mctx=mini.getContext('2d');
const $=id=>document.getElementById(id);
const TW=64,TH=32,HW=TW/2,HH=TH/2,WALL=20,WMAX=13,FILL=1.4,BASE=4.4;
const CHARGE_TIME=7,SURGE_TIME=24;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const THEMES=[
  {name:'砂岩の遺跡',   boss:'砂岩の番人', wall:['#dcc497','#cdb487','#e8d6ad'],fl:[205,16,23],seam:'rgba(60,40,20,.22)',edge:'rgba(255,245,220,.35)'},
  {name:'苔むした神殿', boss:'苔むす番人', wall:['#8fae7a','#7b9a68','#a3c08c'],fl:[160,20,17],seam:'rgba(20,50,20,.28)',edge:'rgba(220,255,200,.3)'},
  {name:'赤煉瓦の水路', boss:'煉瓦の番人', wall:['#c46a4c','#b05b40','#d47c5c'],fl:[20,18,17],seam:'rgba(60,20,10,.32)',edge:'rgba(255,220,200,.3)'},
  {name:'黒曜の宮殿',   boss:'黒曜の番人', wall:['#4d4266','#41375a','#5c5078'],fl:[265,18,15],seam:'rgba(0,0,0,.3)',edge:'rgba(255,214,120,.55)'},
  {name:'白亜の回廊',   boss:'白亜の番人', wall:['#e6e3ee','#d6d2e2','#f2f0f7'],fl:[230,12,30],seam:'rgba(60,60,90,.18)',edge:'rgba(255,255,255,.6)'},
];
/* custom character image (per viewer) */
let charImg=null;
function setCharSrc(src){if(!src){charImg=null;return;}const im=new Image();im.onload=()=>{charImg=im;drawCharPrev();};im.src=src;}
try{setCharSrc(localStorage.getItem('suibotsu-char'));}catch(e){}
const K=(x,y)=>y*8192+x;
const CAT_EARS=false; // set to true to put the cat ears back on the hood
let W=0,H=0,DPR=1,SC=1;
let S=null,camX=0,camY=0,tNow=0,last=0,paused=false,fadeW=0;
let hiscore=0;try{hiscore=+localStorage.getItem('suibotsu-hi2')||0}catch(e){}

function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cvs.clientWidth;H=cvs.clientHeight;cvs.width=W*DPR;cvs.height=H*DPR;SC=Math.max(1,Math.min(1.75,Math.min(W,H)/400));
  const ms=Math.round(Math.max(110,Math.min(170,Math.min(W,H)*.24)));if(mini.width!==ms){mini.width=ms;mini.height=ms;}}
addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
let AC=null;
function tone(f,d=.08,type='square',v=.05,slide=0){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(SFX||AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(AC.state==='suspended')AC.resume();audioGraph();}

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const iso=(x,y)=>[(x-y)*HW,(x+y)*HH];
function hash(x,y){let h=x*374761393+y*668265263;h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)/4294967295;}
const isFloor=(x,y)=>S.tile.get(K(x,y))===0;
function waterAt(x,y){const a=S.arr.get(K(x,y));return a===undefined?0:clamp((S.wt-a)/FILL,0,1)*S.drainF;}
function pPos(){const P=S.P;return P.moving?[P.x+(P.tx-P.x)*P.p,P.y+(P.ty-P.y)*P.p]:[P.x,P.y];}
/* depth: every section sits one flight of stairs below the previous one (boss halls two) */
const zFor=s=>s===0?0:S.sections[s-1].z+(isBoss(s)?56:28);
function dep(x,y){const k=K(x,y),zo=S.zOver.get(k);if(zo!==undefined)return zo;const s=S.sec.get(k);if(s===undefined)return 0;const sc=S.sections[s];if(!sc)return 0;
  if(S.doorAt.has(k)){const n=S.sections[s+1];return n?(sc.z+n.z)/2:sc.z;}return sc.z;}
function pDep(){const P=S.P;return P.moving?dep(P.x,P.y)+(dep(P.tx,P.ty)-dep(P.x,P.y))*P.p:dep(P.x,P.y);}
function isoD(x,y){const [a,b]=iso(x,y);return[a,b+dep(Math.round(x),Math.round(y))];}
function isoP(){const [fx,fy]=pPos(),[a,b]=iso(fx,fy);return[a,b+pDep()];}
function dropBelow(x,y){const d0=dep(x,y);let m=0;for(const [dx,dy] of [[1,0],[0,1],[1,1]]){const k=K(x+dx,y+dy);if(S.tile.has(k))m=Math.max(m,dep(x+dx,y+dy)-d0);}return m;}
function hpush(h,e){h.push(e);let i=h.length-1;while(i>0){const p=(i-1)>>1;if(h[p].t<=h[i].t)break;[h[p],h[i]]=[h[i],h[p]];i=p;}}
function hpop(h){const top=h[0],l=h.pop();if(h.length){h[0]=l;let i=0;for(;;){const a=2*i+1,b=a+1;let m=i;if(a<h.length&&h[a].t<h[m].t)m=a;if(b<h.length&&h[b].t<h[m].t)m=b;if(m===i)break;[h[m],h[i]]=[h[i],h[m]];i=m;}}return top;}
function bfsFrom(sx,sy){const d=new Map([[K(sx,sy),0]]),q=[[sx,sy]];for(let h=0;h<q.length;h++){const [x,y]=q[h],dv=d.get(K(x,y));for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,nk=K(nx,ny);if(isFloor(nx,ny)&&!d.has(nk)){d.set(nk,dv+1);q.push([nx,ny]);}}}return d;}

/* ---------- maze sections ---------- */
function genMaze(N){
  const G=2*N+1,g=Array.from({length:G},()=>new Uint8Array(G).fill(1));
  const vis=new Uint8Array(N*N),st=[[0,0]];vis[0]=1;g[1][1]=0;
  while(st.length){const [cx,cy]=st[st.length-1];
    const nb=DIRS.filter(([dx,dy])=>{const nx=cx+dx,ny=cy+dy;return nx>=0&&ny>=0&&nx<N&&ny<N&&!vis[ny*N+nx]});
    if(!nb.length){st.pop();continue}
    const [dx,dy]=nb[Math.random()*nb.length|0],nx=cx+dx,ny=cy+dy;vis[ny*N+nx]=1;g[2*cy+1+dy][2*cx+1+dx]=0;g[2*ny+1][2*nx+1]=0;st.push([nx,ny]);}
  let k=Math.floor(N*N*.1),tries=0;
  while(k>0&&tries++<4000){const x=1+(Math.random()*(G-2)|0),y=1+(Math.random()*(G-2)|0);if(g[y][x]!==1)continue;
    if((x%2===0&&y%2===1&&!g[y][x-1]&&!g[y][x+1])||(x%2===1&&y%2===0&&!g[y-1][x]&&!g[y+1][x])){g[y][x]=0;k--;}}
  return g;
}
const isBoss=s=>s%5===4;
const sizeOf=s=>isBoss(s)?7:6+Math.min(4,Math.floor(s/3));
const zoneOf=s=>Math.floor(s/5);
function pickType(s){
  if(s===0)return'switch';const z=zoneOf(s),pool=['switch'];
  if(z>=1)pool.push('key','key');if(z>=2)pool.push('timer','timer');
  if(s%5===0&&z>=1)return pool[1+(Math.random()*(pool.length-1)|0)]; // a new zone opens with a newer gimmick
  return pool[Math.random()*pool.length|0];
}
function genSection(s){
  if(S.sections[s])return;
  if(S.story&&s>STORY_LAST)return; // story mode ends at the great guardian (B25)
  const N=sizeOf(s),G=2*N+1,m=isBoss(s)?null:genMaze(N);let ox=0,oy=0,start;
  if(s>0){const p=S.sections[s-1],d=S.doors[s-1];if(p.next==='e'){ox=p.ox+p.G-1;oy=p.oy;start=[d.x+1,d.y];}else{ox=p.ox;oy=p.oy+p.G-1;start=[d.x,d.y+1];}}
  else{ox=oy=ORG;start=[ORG+1,ORG+1];}
  if(!m){genBoss(s,ox,oy,G,start);return;}
  for(let y=0;y<G;y++)for(let x=0;x<G;x++){const k=K(ox+x,oy+y),edge=!x||!y||x===G-1||y===G-1;
    if(edge){if(!S.tile.has(k)){S.tile.set(k,1);S.sec.set(k,s);}}else{S.tile.set(k,m[y][x]);S.sec.set(k,s);}}
  const next=Math.random()<.5?'e':'s';S.sections[s]={ox,oy,G,next,theme:zoneOf(s)%THEMES.length,start,z:zFor(s)};
  if(zoneOf(s)>=3&&(s%5===0||s%5===1||s%5===3))placeRotators(s,ox,oy,N,start);
  const dS=bfsFrom(start[0],start[1]);
  const lim=Math.min(G,2*sizeOf(s+1)+1)-1,cands=[];
  for(let i=1;i<lim;i+=2){const door=next==='e'?[ox+G-1,oy+i]:[ox+i,oy+G-1],inner=next==='e'?[ox+G-2,oy+i]:[ox+i,oy+G-2];cands.push({door,inner,d:dS.get(K(inner[0],inner[1]))||0});}
  cands.sort((a,b)=>b.d-a.d);const ch=cands[Math.random()*Math.min(3,cands.length)|0];
  const dk=K(ch.door[0],ch.door[1]);S.tile.set(dk,2);S.sec.set(dk,s);
  const type=pickType(s);
  const door={x:ch.door[0],y:ch.door[1],s,type,need:0,count:0,open:false,perm:false,hasKey:false,timer:0,dur:0,anim:0};
  S.doors[s]=door;S.doorAt.set(dk,s);
  const dD=bfsFrom(ch.inner[0],ch.inner[1]),cells=[];
  for(const [k,dv] of dS){const x=k%8192,y=(k-x)/8192;if(S.sec.get(k)!==s||S.armSet.has(k))continue;if((x===start[0]&&y===start[1])||(x===ch.inner[0]&&y===ch.inner[1]))continue;cells.push({x,y,k,dS:dv,dD:dD.get(k)??99});}
  const maxS=Math.max(...cells.map(c=>c.dS)),used=new Set(),take=c=>{used.add(c.k);return c;};
  if(type==='switch'){
    door.need=s===0?1:Math.min(3,1+Math.floor(s/3)+(Math.random()<.35?1:0));
    const far=cells.filter(c=>c.dS>maxS*.3).sort(()=>Math.random()-.5),picked=[];
    for(const c of far){if(picked.length>=door.need)break;if(picked.every(p=>Math.abs(p.x-c.x)+Math.abs(p.y-c.y)>=5))picked.push(take(c));}
    if(!picked.length)picked.push(take(cells[0]));
    door.need=picked.length;
    for(const c of picked)S.feat.set(c.k,{type:'switch',door:s,on:false});
  }else if(type==='key'){
    const c=cells.slice().sort((a,b)=>(b.dS+b.dD*1.2)-(a.dS+a.dD*1.2))[Math.random()*3|0]||cells[0];take(c);S.feat.set(c.k,{type:'key',door:s});
  }else{
    const pool=cells.filter(c=>c.dD>=6&&c.dD<=14&&c.dS>3),src=pool.length?pool:cells,c=src[Math.random()*src.length|0];take(c);
    door.dur=Math.round((c.dD/BASE)*1.55+3);S.feat.set(c.k,{type:'timer',door:s,on:false});
  }
  if(s%5===2){ // item shop: prefer a dead end at mid distance
    const nb=c=>DIRS.filter(([dx,dy])=>isFloor(c.x+dx,c.y+dy)).length;
    const ends=cells.filter(c=>!used.has(c.k)&&nb(c)===1&&c.dS>3),mid=ends.filter(c=>c.dS>maxS*.25&&c.dS<maxS*.8);
    const pool=(mid.length?mid:ends).sort(()=>Math.random()-.5);
    if(pool.length){take(pool[0]);S.feat.set(pool[0].k,{type:'shop'});}
  }
  if(s===0){ // the first floor always has an ice crystal just past the start, echoing the opening scene
    const c=cells.filter(c=>!used.has(c.k)&&c.dS>=3&&c.dS<=6).sort((a,b)=>a.dS-b.dS)[0];if(c){take(c);S.feat.set(c.k,{type:'ice'});}}
  if(Math.random()<.7){const a=pickArchive(zoneOf(s));if(a){const pool=cells.filter(c=>!used.has(c.k)&&c.dS>maxS*.35).sort(()=>Math.random()-.5);if(pool.length){take(pool[0]);S.feat.set(pool[0].k,{type:"archive",id:a.id});S.placedArch.add(a.id);}}}
  if(S.story&&s<STORY_LAST){const pool=cells.filter(c=>!used.has(c.k)&&c.dS>maxS*.45).sort(()=>Math.random()-.5);if(pool.length){take(pool[0]);S.feat.set(pool[0].k,{type:'cat'});}}
  spawnMobs(s,cells,used);
  for(const c of cells){if(used.has(c.k))continue;const r=Math.random();
    if(r<.02)S.feat.set(c.k,{type:'ice'});else if(r<.035)S.feat.set(c.k,{type:'boot'});else if(r<.36)S.feat.set(c.k,{type:'coin'});}
}

/* ---------- rotating walls ---------- */
// A rotator is a pillar on a wall junction with two arms. State 0: north/south arms are walls; state 1: east/west arms.
const armsOf=([cx,cy])=>({A:[[cx,cy-1],[cx,cy+1]],B:[[cx-1,cy],[cx+1,cy]]});
function setRot(centers,st){for(const c of centers){const {A,B}=armsOf(c);for(const [x,y] of (st?B:A))S.tile.set(K(x,y),4);for(const [x,y] of (st?A:B))S.tile.set(K(x,y),0);}}
// Rotators only go where all four arm spots are walls in the generated maze, so the normal route never needs them.
// Among those, keep the ones whose open arms cut the walk from the entrance to the far edge the most: a shortcut, never a gate.
function placeRotators(s,ox,oy,N,start){
  const G=2*N+1,sc=S.sections[s],farEdge=[];
  for(let i=1;i<G-1;i+=2)farEdge.push(sc.next==='e'?[ox+G-2,oy+i]:[ox+i,oy+G-2]);
  const farDist=()=>{const d=bfsFrom(start[0],start[1]);let m=0;for(const [x,y] of farEdge)m=Math.max(m,d.get(K(x,y))||0);return d;};
  const avgTo=(d)=>{let t=0,n=0;for(const [k,v] of d){const x=k%8192,y=(k-x)/8192;if(S.sec.get(k)===s&&(x-ox)%2===1&&(y-oy)%2===1){t+=v;n++;}}return n?t/n:0;};
  const cells=()=>{let n=0;for(const [k] of bfsFrom(start[0],start[1])){const x=k%8192,y=(k-x)/8192;if(S.sec.get(k)===s&&(x-ox)%2===1&&(y-oy)%2===1)n++;}return n;};
  const wallAll=cs=>{const saved=[];for(const c of cs){const {A,B}=armsOf(c);for(const [ax,ay] of [...A,...B]){saved.push([K(ax,ay),S.tile.get(K(ax,ay))]);S.tile.set(K(ax,ay),1);}}return saved;};
  const restore=saved=>{for(let i=saved.length-1;i>=0;i--)S.tile.set(saved[i][0],saved[i][1]);};
  const cands=[];
  for(let y=oy+2;y<=oy+G-3;y+=2)for(let x=ox+2;x<=ox+G-3;x+=2){
    const saved=wallAll([[x,y]]);
    if(cells()===N*N){ // normal route exists with every arm closed
      const base=avgTo(farDist());let gain=0;
      for(const st of [0,1]){setRot([[x,y]],st);gain=Math.max(gain,base-avgTo(farDist()));wallAll([[x,y]]);}
      if(gain>=.4)cands.push({x,y,gain:gain+Math.random()*.4});
    }
    restore(saved);
  }
  cands.sort((a,b)=>b.gain-a.gain);
  const want=1+(zoneOf(s)>=2?1:0)+(N>=8?1:0),centers=[];
  for(const c of cands){if(centers.length>=want)break;if(centers.some(o=>Math.abs(o[0]-c.x)+Math.abs(o[1]-c.y)<6))continue;
    const saved=wallAll([...centers,[c.x,c.y]]);const ok=cells()===N*N;restore(saved);if(ok)centers.push([c.x,c.y]);}
  if(!centers.length)return;
  setRot(centers,0);
  const period=Math.max(3,4.5-.4*zoneOf(s));
  S.rots.push({s,centers,state:0,t:period,period});
  for(const c of centers){S.tile.set(K(c[0],c[1]),1);S.rotC.add(K(c[0],c[1]));const {A,B}=armsOf(c);for(const [x,y] of [...A,...B])S.armSet.add(K(x,y));}
}
function updRots(dt){
  const P=S.P;
  for(const g of S.rots){if(Math.abs(g.s-S.cur)>1)continue;g.t-=dt;if(g.t>0)continue;
    const closing=[];for(const c of g.centers){const {A,B}=armsOf(c);closing.push(...(g.state?A:B));}
    if(closing.some(([x,y])=>(P.x===x&&P.y===y)||(P.moving&&P.tx===x&&P.ty===y))){g.t=.2;continue;}
    g.state=1-g.state;g.t=g.period;setRot(g.centers,g.state);
    for(const c of g.centers){const {A,B}=armsOf(c);
      for(const [x,y] of (g.state?A:B)){const k=K(x,y),fl=S.arr.has(k);
        for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,a=S.arr.get(K(nx,ny));
          if(fl&&isFloor(nx,ny))pushWater(nx,ny,S.wt+1/vwEff());else if(!fl&&a!==undefined&&a<=S.wt)pushWater(x,y,S.wt+1/vwEff());}}
      const [sx,sy]=c;for(let i=0;i<5;i++)S.parts.push({x:sx+(Math.random()-.5),y:sy+(Math.random()-.5),z:8,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,vz:60,life:.5,max:.5,c:'#c9a46a',r:2.5});}
    if(Math.abs(g.s-S.cur)<=0)tone(120,.18,'square',.05,-40);
  }
}

/* ---------- hearts, emergency device ---------- */
const vwEff=()=>S.vw*(1-.08*S.up.slow);
function loseHeart(){S.hearts--;S.inv=2.5;const [fx,fy]=pPos();burst(fx,fy,'#ff5a6e',14);tone(150,.3,'square',.06,-80);
  S.waves.push({x:fx,y:fy,r:.3,max:7,hit:false});setTimeout(()=>tone(600,.35,'sine',.05,-450),60); // emergency device shockwave
  if(S.hearts<=0){S.hearts=0;if(S.escape){S.state='ending';startEnding('buried');}else if(S.story)startContinue();else startRescue();return false;}return true;}
function startRescue(){
  S.state='rescue';S.rescue={t:0,a:0};if(!S.testMode){META.stats.rescues++;saveMeta();}trophy('rescued');if(META.stats.rescues>=5)trophy('rescue5');closeShop();$('bigtimer').hidden=true;$('bosshp').hidden=true;
  bannerShow('','力尽きた…',1.3);tone(300,.6,'sawtooth',.05,-200);
  setTimeout(()=>{tone(880,.12,'triangle',.05);setTimeout(()=>tone(1175,.18,'triangle',.05),120);},900);
}
/* ---------- high scores (kept in this browser) ---------- */
function loadScores(){try{const a=JSON.parse(localStorage.getItem('suibotsu-scores')||'[]');return Array.isArray(a)?a:[];}catch(e){return[];}}
function saveScores(a){try{localStorage.setItem('suibotsu-scores',JSON.stringify(a.slice(0,10)));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ranksHTML(list,hi=-1,max=10){if(!list.length)return'<p class="hint">まだ記録がありません。</p>';
  return`<ol class="ranks">${list.slice(0,max).map((r,i)=>`<li class="${i===hi?'me':''}"><span class="rk">${i+1}</span><span class="nm">${esc(r.name)}</span><span class="fl">B${r.floor}F</span><span class="sc">${r.score}</span></li>`).join('')}</ol>`;}
function scoreEntry(){

  for(const sp of B.spinners){const [cx,cy]=isoD(sp.x,sp.y),warn=sp.t<.35;
    ctx.strokeStyle=warn?`rgba(255,200,90,${.5+.5*Math.sin(tNow*40)})`:'rgba(240,192,112,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(cx,cy,HW*.55,HH*.55,0,0,7);ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.scale(1,.5);ctx.rotate(tNow*9);ctx.fillStyle='#b08a4a';ctx.fillRect(-12,-3,24,6);ctx.restore();
    if(warn)for(const [x,y] of spinCells(sp,1-sp.o)){const [ax,ay]=isoD(x,y);ctx.strokeStyle='rgba(255,180,80,.8)';ctx.lineWidth=2;ctx.setLineDash([4,4]);poly2(diamond(ax,ay));ctx.setLineDash([]);}}
}
/* the bull's way round: along its loop, and around a spinner when one swings across */
function bullDetour(B){
  const n=B.path.length,sx=Math.round(B.cx),sy=Math.round(B.cy),goal=new Map();
  for(let a=2;a<=Math.floor(n/2);a++){const j=(B.pi+a)%n,[x,y]=B.path[j];if(!goal.has(K(x,y)))goal.set(K(x,y),j);}
  const prev=new Map([[K(sx,sy),null]]),q=[K(sx,sy)];let best=null,bestA=1e9;
  for(let h=0;h<q.length;h++){const k=q[h];for(const m of [k+1,k-1,k+8192,k-8192]){if(prev.has(m)||S.sec.get(m)!==B.s||S.tile.get(m)!==0)continue;prev.set(m,k);
      if(goal.has(m)){const a=(goal.get(m)-B.pi+n)%n;if(a<bestA){bestA=a;best=m;}}q.push(m);}}
  if(best===null)return null;
  const route=[];let c=best;while(c!==K(sx,sy)){route.unshift([c%8192,Math.floor(c/8192)]);c=prev.get(c);}B.detTo=goal.get(best);return route;
}
function bullNext(B){return B.det&&B.det.length?B.det[0]:B.path[(B.pi+1)%B.path.length];}
function rushAmidaAI(B,dt){
  updSpinners(B,dt);
  if(B.mode==='idle'){B.t-=dt;if(B.t<=0){for(const [k,f] of [...S.feat])if(f.type==='bombsw')S.feat.delete(k);
      B.ring=(B.ring||0)+1;B.path=rushMaze(B);scatterRushBlocks(B);B.mode='drop';B.t=1.9;B.phaseHits=0;B.det=null;bannerShow('','ブロックが降りそそぎ、迷路になった！',1.2);}}
  else if(B.mode==='drop'){B.t-=dt;if(B.t<=0){setupSpinners(B);sproutRushBombs(B);amidaWalk(B,.8);}}
  else if(B.mode==='walk'){
    let rem=11*dt;while(rem>0&&B.ri<B.route.length){const [nx,ny]=B.route[B.ri],dx=nx-B.cx,dy=ny-B.cy,l=Math.hypot(dx,dy);if(l>0){B.dirx=Math.sign(dx);B.diry=Math.sign(dy);}
      if(l<=rem){B.cx=nx;B.cy=ny;B.ri++;rem-=l;}else{B.cx+=dx/l*rem;B.cy+=dy/l*rem;rem=0;}}
    if(B.ri>=B.route.length){B.cx=B.path[0][0];B.cy=B.path[0][1];B.pi=0;B.mode='aim';B.t=B.aimT;tone(200,.3,'sawtooth',.05,200);}}
  else if(B.mode==='aim'){B.t-=dt;if(B.t<=0){B.mode='run';tone(90,.5,'sawtooth',.07,60);bannerShow('',`角牛が暴れ回る！ 爆弾を ${BULL_PHASE_BOMBS} 発ぶつけて止めろ`,1.8);}}
  else if(B.mode==='run'){
    for(const [k,f] of [...S.feat])if(f.type==='bombsw'&&f.armed&&(f.age=(f.age||0)+dt)>12){S.feat.delete(k);sproutRushBombs(B,1);const nf=[...S.feat.values()].pop();if(nf&&nf.type==='bombsw'){nf.armed=true;nf.grow=1;}burst(k%8192,Math.floor(k/8192),'#ffb03a',6);}
    let rem=(14+.35*(B.max-B.hp))*dt,guard=0;
    while(rem>0&&guard++<12){
      let [tx,ty]=bullNext(B);
      if(S.tile.get(K(tx,ty))!==0){ // a spinner swung across: find a way around, or turn back
        const d=bullDetour(B);if(d){B.det=d;}else{B.det=null;B.path.reverse();B.pi=B.path.length-1-B.pi;}
        [tx,ty]=bullNext(B);if(S.tile.get(K(tx,ty))!==0)break;}
      const dx=tx-B.cx,dy=ty-B.cy,l=Math.hypot(dx,dy);if(l>0){B.dirx=Math.sign(dx);B.diry=Math.sign(dy);}
      if(l>rem){B.cx+=dx/l*rem;B.cy+=dy/l*rem;rem=0;break;}
      B.cx=tx;B.cy=ty;rem-=l;
      if(B.det&&B.det.length){B.det.shift();if(!B.det.length){B.pi=B.detTo;B.det=null;}}else B.pi=(B.pi+1)%B.path.length;
      const bk=K(tx,ty),bf=S.feat.get(bk);
      if(bf&&bf.type==='bombsw'&&bf.armed){S.feat.delete(bk);explodeBomb(B,tx,ty);if(!S.boss||B.dying>0)return;
        B.phaseHits=(B.phaseHits||0)+1;
        if(B.phaseHits>=BULL_PHASE_BOMBS){B.mode='rest';B.t=2.6;bannerShow('','角牛が止まった！',1.4);return;}
        bannerShow('',`爆弾命中！ あと ${BULL_PHASE_BOMBS-B.phaseHits} 発で止まる`,1.2);sproutRushBombs(B,1);rem=0;}}
    if(Math.random()<dt*50)S.parts.push({x:B.cx,y:B.cy,z:3,vx:(Math.random()-.5),vy:(Math.random()-.5),vz:40,life:.4,max:.4,c:'rgba(200,190,170,.7)',r:3});}
  else if(B.mode==='rest'){B.t-=dt;if(B.t<=0){clearAmidaBlocks();clearSpinners(B);for(const [k,f] of [...S.feat])if(f.type==='bombsw')S.feat.delete(k);B.mode='idle';B.t=.8;}}
}
/* shield bash (Z while guarding): scatter small enemies and bullets; the bull and the hero knock each other back */
// the bash deals 1 damage (more with the shop item); the white guardian and a charging bull just shrug it off
function bashDamage(B,part){
  const n=1+(S.up.bash||0);
  if(B.type==='ball'){for(let i=0;i<n&&S.boss&&B.dying<=0;i++){const alive=[B,...(B.clones||[])];const t=alive.includes(part)?part:alive[0];ballHit(t,'盾突進');}}
  else if(B.type==='dice'){ // the struck die, then the nearest others, one hit each
    const order=[part,...[B,...B.clones].filter(d=>d!==part).sort((a,b)=>Math.hypot(a.cx-part.cx,a.cy-part.cy)-Math.hypot(b.cx-part.cx,b.cy-part.cy))];
    for(let i=0;i<n&&i<order.length&&S.boss&&B.dying<=0;i++){B.flash=0;hitDie(order[i],'盾突進');}}
  else if(B.type==='great'){if(B.exposed>0&&B.flash<=0){damageBoss(B,'盾突進');B.exposed=0;B.shell=2;if(S.boss&&B.hp>0)sproutGreatBombs();}else bannerShow('','ガキン！ 殻が硬い',.8);}
  else for(let i=0;i<n&&S.boss&&B.dying<=0;i++)damageBoss(B,'盾突進');
}
function shieldBash(dt){
  const D=S.dash,[fx,fy]=pPos(),P=S.P;
  S.mobs=S.mobs.filter(m=>{const [mx,my]=mobPos(m);if(Math.hypot(mx-fx,my-fy)<1){burst(mx,my,'#9fe8ff',12);tone(900,.1,'square',.05,-300);return false;}return true;});
  const nShots=S.shots.length;S.shots=S.shots.filter(p=>Math.hypot(p.x-fx,p.y-fy)>.8);if(S.shots.length<nShots)tone(1200,.06,'square',.03);
  const B=S.boss;if(!B||B.dying>0||D.hit.has(B))return;
  const parts=[B,...(B.clones||[])],reach=b=>B.type==='guardian'||B.type==='great'?1.9:B.type==='amida'?1.15:B.type==='dice'?.8*diceScale(b)+.3:1;
  const hitPart=parts.filter(b=>Math.hypot(b.cx-fx,b.cy-fy)<reach(b)).sort((a,b)=>Math.hypot(a.cx-fx,a.cy-fy)-Math.hypot(b.cx-fx,b.cy-fy))[0];
  if(!hitPart)return;D.hit.add(B);
  const back=[-D.dir[0],-D.dir[1]],[bx,by]=[fx+D.dir[0]*.6,fy+D.dir[1]*.6];
  for(let i=0;i<2;i++)burst(bx,by,'#ffe98a',12);tone(140,.3,'square',.07,-40);tone(900,.12,'square',.05,-500);
  S.dash={dir:back,left:B.type==='amida'?2:1,stop:true,kb:true,t:0,dur:.3};S.inv=Math.max(S.inv,.8);P.dir=null;P.q=null;
  const charging=B.type==='amida'&&['charge','walk','run'].includes(B.mode);
  if(charging){B.kbT=.9;bannerShow('','相打ち！ 角牛もはじき返した',1.1);return;}
  if(B.type==='guardian'){bannerShow('','ガキン！ びくともしない',.8);return;}
  bashDamage(B,hitPart);
}
/* ---------- dodge (Z): a quick invulnerable dash that costs stamina ---------- */
const DODGE_COST=34,DODGE_TILES=2,DODGE_SPEED=2.6,DODGE_IFRAMES=.42,STAM_REGEN=28,STAM_DELAY=.5;
const dodgeCost=()=>DODGE_COST-4*(S.up.roll||0),dodgeIfr=()=>DODGE_IFRAMES+.12*(S.up.roll||0);
function dodge(){
  if(!S||S.state!=='play'||paused||S.dash||S.pStun>0)return;
  const bash=S.guard;const P=S.P,dir=bash?P.face:P.moving?[P.tx-P.x,P.ty-P.y]:(P.dir||P.face);
  if(S.stam<dodgeCost()){tone(180,.12,'square',.03,-40);$('stbar').classList.add('low');return;}
  if(!P.moving&&!isFloor(P.x+dir[0],P.y+dir[1])){tone(200,.08,'square',.03);return;} // nowhere to go
  S.stam-=dodgeCost();S.stamCd=STAM_DELAY;S.dash={dir:[dir[0],dir[1]],left:(P.moving?DODGE_TILES-1:DODGE_TILES)+(bash?1+(S.up.bash||0):0),stop:!P.moving&&!P.dir||bash,t:0,dur:DODGE_TILES/(BASE*DODGE_SPEED*(1+.08*S.up.speed)),bash,hit:new Set()};S.dodgeT=dodgeIfr()+(bash?.15:0);
  P.face=[dir[0],dir[1]];const [fx,fy]=pPos();burst(fx,fy,bash?'#9fe8ff':'#e8f4ff',bash?14:8);
  if(bash){tone(220,.25,'sawtooth',.05,180);bannerShow('','盾で突進！',.6);}else tone(700,.16,'sine',.04,-500);
}
function updDodge(dt){
  if(S.dodgeT>0)S.dodgeT=Math.max(0,S.dodgeT-dt);
  if(S.stamCd>0)S.stamCd-=dt;else if(!S.dash)S.stam=Math.min(100,S.stam+STAM_REGEN*dt);
  for(const g of S.ghosts)g.life-=dt;S.ghosts=S.ghosts.filter(g=>g.life>0);
  if(S.pStun>0)S.pStun=Math.max(0,S.pStun-dt);
  if(S.dash&&S.dash.bash)shieldBash(dt);
  if(S.dash){S.dash.t+=dt;const [fx,fy]=pPos();if(Math.random()<.5)S.parts.push({x:fx,y:fy,z:4,vx:(Math.random()-.5),vy:(Math.random()-.5),vz:30,life:.3,max:.3,c:'#e8f4ff',r:2});}
}

addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return; // typing a name
  if(S&&S.state==='corecut'&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();S.coreCut.t=Math.max(S.coreCut.t,S.coreCut.t<5.9?5.85:7.9);return;}
  if(S&&S.radio&&!paused&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();radioNext();return;}
  if(S&&S.state==='continue'){if(e.code==='Enter'||e.code==='Space'){e.preventDefault();continueStory();}else if(e.code==='Escape'){e.preventDefault();giveUpContinue();}return;}
  if(e.code==='KeyZ'&&!e.repeat){e.preventDefault();initAudio();dodge();return;}
  if(e.code==='KeyX'){e.preventDefault();if(S&&S.state==='play'&&!paused&&!(S.pStun>0))S.guard=true;return;}
  if(KEYS[e.code]){e.preventDefault();initAudio();queue(KEYS[e.code]);}
  else if(/^(Digit|Numpad)[1-9]$/.test(e.code)&&S&&S.shopOpen){e.preventDefault();buy(+e.code.slice(-1)-1);}
  else if((e.code==='Space'||e.code==='Enter'||e.code==='Escape')&&S&&S.state==='cut'){e.preventDefault();endCut();}
  else if(e.code==='Space'||e.code==='Enter'){const b=document.querySelector('#card .btn');if(!$('overlay').hidden&&b){e.preventDefault();b.click();}}
  else if(e.code==='KeyM')toggleMute();

function openDoor(d){
  if(d.open)return;d.open=true;d.anim=1;S.tile.set(K(d.x,d.y),0);
  genSection(d.s+2);
  for(const [dx,dy] of DIRS){const a=S.arr.get(K(d.x+dx,d.y+dy));if(a!==undefined&&a<=S.wt)pushWater(d.x,d.y,S.wt+1/vwEff());}
  tone(330,.12,'square',.05);setTimeout(()=>tone(494,.12,'square',.05),90);setTimeout(()=>tone(659,.2,'square',.05),180);

}
function closeDoor(d){
  const P=S.P,k=K(d.x,d.y),a=S.arr.get(k);
  if(a!==undefined&&a<=S.wt){d.perm=true;return;}           // water jams it open
  if((P.x===d.x&&P.y===d.y)||(P.moving&&P.tx===d.x&&P.ty===d.y)){d.timer=.3;return;}
  d.open=false;S.tile.set(k,2);
  for(const f of S.feat.values())if(f.type==='timer'&&f.door===d.s)f.on=false;

}
const curDoor=()=>S.doors[S.cur];

/* ---------- water ---------- */
function pushWater(x,y,t){const k=K(x,y);if(S.arr.has(k)||S.queued.has(k))return;S.queued.add(k);hpush(S.heap,{t,x,y});}
function flow(){
  while(S.heap.length&&S.heap[0].t<=S.wt){
    const e=hpop(S.heap),k=K(e.x,e.y);S.queued.delete(k);
    if(S.arr.has(k)||!isFloor(e.x,e.y))continue;   // a door that closed in the meantime stops the water
    const sc=S.sections[S.sec.get(k)];
    if(sc&&sc.dry){if(S.grates.has(k)&&Math.random()<.5)S.parts.push({x:e.x,y:e.y,z:4,vx:0,vy:0,vz:70,life:.5,max:.5,c:'#8fe3f5',r:2.5});continue;} // drained away
    const du=S.dryT.get(k);if(du!==undefined){if(e.t<du){pushWater(e.x,e.y,du);continue;}S.dryT.delete(k);} // evaporated patch
    S.arr.set(k,e.t);
    for(const [dx,dy] of DIRS){const nx=e.x+dx,ny=e.y+dy;if(isFloor(nx,ny))pushWater(nx,ny,e.t+1/vwEff());}
  }
}

/* ---------- game logic ---------- */
function reveal(){const {P}=S;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)if(Math.abs(dx)+Math.abs(dy)<=4)S.seen.add(K(P.x+dx,P.y+dy));}
function onArrive(){

    else if(f.type==='gbomb'&&!f.armed){f.armed=true;f.fuse=2.2;tone(520,.12,'square',.05);bannerShow('','導火線に火がついた！ 離れろ！',1);}

    else if(f.type==='ice'){S.feat.delete(k);S.ice=5;META.stats.ices++;saveMeta();if(META.stats.ices>=10)trophy('ice10');S.score+=50;tone(1500,.25,'sine',.06,-900);burst(P.x,P.y,'#bff3ff',14);bannerShow('','水が凍った！',1);}
    else if(f.type==='boot'){S.feat.delete(k);S.boot=6;S.score+=50;tone(500,.2,'sawtooth',.04,700);burst(P.x,P.y,'#ff9a5c',14);}
    else if(f.type==='switch'&&!f.on){f.on=true;const d=S.doors[f.door];d.count++;S.score+=30;tone(700,.08,'square',.05);tone(1050,.1,'square',.04);burst(P.x,P.y,'#7dff9a',10);

    S.cur=s;if(s>S.best){S.best=s;S.score+=100*s;{const fl=s+1;if(fl>=2)trophy('b2');if(fl>=5)trophy('b5');if(fl>=10)trophy('b10');if(fl>=20)trophy('b20');}
      if(S.sections[s].boss)startBoss(s);

function tryDoorAhead(){const P=S.P,d0=P.q||P.dir;if(!d0)return;const di=S.doorAt.get(K(P.x+d0[0],P.y+d0[1]));
  if(di!==undefined){const d=S.doors[di];if(!d.open&&d.type==='key'&&d.hasKey)openDoor(d);}}
function updatePlayer(dt){
  const P=S.P,[fx,fy]=pPos(),wHere=waterAt(Math.round(fx),Math.round(fy));
  let remain=BASE*(1+.08*S.up.speed)*(S.boot>0?1.45:1)*(wHere>.06?Math.min(1,.7+.1*S.up.swim):1)*dt*(S.dash?DODGE_SPEED:1),guard=0;
  while(remain>1e-6&&guard++<8){
    if(!P.moving){
      if(S.dash){const [ax,ay]=S.dash.dir;if(S.dash.left>0&&isFloor(P.x+ax,P.y+ay)){P.dir=S.dash.dir;P.q=null;S.dash.left--;}else{if(S.dash.stop)P.dir=null;S.dash=null;remain/=DODGE_SPEED;}}
      if(!S.dash&&(S.guard||S.pStun>0)){P.dir=null;P.q=null;break;} // planted while guarding or dizzy
      tryDoorAhead();
      if(P.q&&isFloor(P.x+P.q[0],P.y+P.q[1])){P.dir=P.q;P.q=null;}
      if(P.dir&&isFloor(P.x+P.dir[0],P.y+P.dir[1])){P.tx=P.x+P.dir[0];P.ty=P.y+P.dir[1];P.moving=true;P.p=0;P.face=P.dir;}
      else break;
    }
    const step=Math.min(remain,1-P.p);P.p+=step;remain-=step;
    if(P.p>=1-1e-6){P.x=P.tx;P.y=P.ty;P.moving=false;P.p=0;onArrive();if(S.state!=='play')break;}
  }
  if(wHere>.06&&P.moving&&Math.random()<dt*14)S.parts.push({x:fx,y:fy,z:wHere*WMAX,vx:(Math.random()-.5)*1.2,vy:(Math.random()-.5)*1.2,vz:60+Math.random()*40,life:.5,max:.5,c:'#dff6ff',r:2});
}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28;S.parts.push({x,y,z:14,vx:Math.cos(a)*1.6,vy:Math.sin(a)*1.6,vz:80+Math.random()*60,life:.6,max:.6,c,r:2.5});}}
let warnT=0,lastTick=-1,lastSec=-1;
function update(dt){
  S.time+=dt;updDodge(dt);
  if(S.inv>0)S.inv=Math.max(0,S.inv-dt);
  updWaves(dt);
  for(const j of S.jets)j.t-=dt;S.jets=S.jets.filter(j=>j.t>0);
  if(S.drainT>0){S.drainT-=dt;S.drainF=clamp(S.drainT/2.5,0,1);
    if(Math.random()<dt*20){const g=[...S.grates];const k=g[Math.random()*g.length|0];if(k!==undefined){const x=k%8192;S.parts.push({x,y:(k-x)/8192,z:2,vx:0,vy:0,vz:-30,life:.4,max:.4,c:'#8fe3f5',r:3});}}
    if(S.drainT<=0){S.arr.clear();S.heap.length=0;S.queued.clear();S.drainF=1;S.wt=0;S.released=false;S.charge=0;S.surge=0;bannerShow('','水が引いた',1.2);}}
  if(S.boss)updBoss(dt);
  if(S.boss&&S.boss.type==='great')greatUpd(S.boss,dt);
  if(S.great&&!S.boss&&S.greatT>0){S.greatT-=dt;if(S.greatT<=0)greatNext();}
  if(S.great&&S.great.beam>0)S.great.beam=Math.max(0,S.great.beam-dt*1.5);
  if(S.escape)updEscape(dt);
  if(S.bigCore){S.breath=100;coreTouch();}
  for(const d of S.doors){if(d&&d.holding){
    if(!d.wet&&doorWet(d)){d.wet=true;bannerShow('','水が扉に届いた！ 水圧がかかっていく…',1.6);tone(90,.5,'sawtooth',.05,-20);}
    if(d.wet){d.hold-=dt;if(d.hold<=0)breakDoor(d);}}}
  if(S.pressureT>0){S.pressureT-=dt;if(S.pressureT<=0)trophy('pressure');}
  if(!S.released){
    S.charge=Math.min(1,S.charge+dt/CHARGE_TIME);
    const tick=Math.floor(S.charge*10);if(tick!==lastTick&&S.charge>.6)tone(400+tick*60,.05,'square',.03);lastTick=tick;
    if(S.charge>=1){S.released=true;if(S.frozen.size)S.thaw=1;for(const [x,y] of S.sources)pushWater(x,y,0);bannerShow('','水が来るぞ！',1.6);tone(160,.6,'sawtooth',.06,-80);tone(90,.8,'sine',.08);}
  }else{
    if(S.ice>0)S.ice=Math.max(0,S.ice-dt);
    else{S.wt+=dt;S.surge+=dt/SURGE_TIME;if(S.surge>=1){S.surge=0;S.vlv++;S.vw=Math.min(4,S.vw+.28);bannerShow('',`水勢アップ！ Lv${S.vlv}`,1.4);tone(140,.5,'sawtooth',.06,120);}}
    flow();
  }
  if(S.boot>0)S.boot=Math.max(0,S.boot-dt);
  if(S.thaw>0){S.thaw-=dt;if(S.thaw<=0){S.thaw=0;S.frozen.clear();}}
  for(const d of S.doors){if(!d)continue;if(d.type==='timer'&&d.open&&!d.perm){d.timer-=dt;if(d.timer<=0)closeDoor(d);}if(d.anim>0)d.anim=Math.max(0,d.anim-dt*2.5);}
  updatePlayer(dt);
  if(S.state!=='play')return;
  const [fx,fy]=pPos(),w=waterAt(Math.round(fx),Math.round(fy));
  updRots(dt);updMobs(dt);
  if(S.shopOpen){const sf=S.feat.get(K(S.P.x,S.P.y));if(S.P.moving||!sf||sf.type!=='shop')closeShop();}
  if(w>.55&&!S.wasDeep)splash(.5);if(w>.06&&!S.wasWet)splash(.2);S.wasDeep=w>.55;S.wasWet=w>.06;
  if(w>.55){if(S.inv<=0&&!S.tank)S.breath-=34*(1-.22*S.up.tank)*dt;if(Math.random()<dt*10)S.parts.push({x:fx,y:fy,z:w*WMAX+20,vx:0,vy:0,vz:30,life:.8,max:.8,c:'#bfefff',r:3,bubble:1});
    warnT-=dt;if(warnT<=0){tone(180,.12,'sine',.05,-60);warnT=.45;}}
  else S.breath=Math.min(100,S.breath+28*dt);
  // big countdown for an open timer door
  const td=S.doors.find(d=>d&&d.type==='timer'&&d.open&&!d.perm),bt=$('bigtimer');
  if(td){const sec=Math.ceil(td.timer);bt.hidden=false;bt.classList.toggle('red',sec<=3);
    if(sec!==lastSec){$('bigsec').innerHTML=`${sec}<i>秒</i>`;bt.classList.remove('pop');void bt.offsetWidth;bt.classList.add('pop');if(lastSec!==-1)tone(sec<=3?1100:800,.07,'square',.05);lastSec=sec;}}
  else{bt.hidden=true;lastSec=-1;}
  if(S.breath<=0){S.breath=0;emergency();if(S.state!=='play')return;}
  if(S.released&&S.ice<=0)for(const [x,y] of S.sources)if(Math.random()<dt*30){const a=Math.random()*6.28;S.parts.push({x,y,z:WMAX,vx:Math.cos(a)*1.4,vy:Math.sin(a)*1.4,vz:120+Math.random()*90,life:.9,max:.9,c:'#8fe3f5',r:2.5});}
}

  if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('banner').hidden=true;else if(bannerT<.4)$('banner').style.opacity=bannerT/.4;}
  draw();drawMini();
  if(fadeW>0){fadeW=Math.max(0,fadeW-dt*1.4);ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=`rgba(255,255,255,${fadeW})`;ctx.fillRect(0,0,W,H);}
  requestAnimationFrame(frame);
}
newRun();S.state='demo';$('banner').hidden=true;bannerT=0;
titleScreen();
requestAnimationFrame(frame);
})();
